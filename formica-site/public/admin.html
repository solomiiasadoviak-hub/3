<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formica Admin</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0e0e10; --bg2:#16161a; --bg3:#1e1e23; --line:#2b2b31; --text:#ece9e3; --muted:#9c988f; --gold:#c9b38a; --red:#e48b77; --green:#8fc59a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 18px; background:var(--bg2); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; letter-spacing:.2em; text-transform:uppercase; margin:0 16px 0 0; font-weight:500; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button, .btn { background:var(--bg3); border:1px solid var(--line); color:var(--text); padding:8px 14px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on { border-color:var(--gold); color:var(--gold); }
  .btn.primary { background:var(--gold); color:#111; border-color:var(--gold); font-weight:600; }
  .btn.danger { color:var(--red); }
  .btn.sm { padding:4px 9px; font-size:12px; }
  .spacer { flex:1; }
  #status { color:var(--muted); font-size:13px; }
  main { padding:20px 18px 80px; max-width:1300px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; background:var(--bg2); white-space:nowrap; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; background:var(--bg3); border:1px solid var(--line); }
  .badge.warn { color:var(--red); border-color:var(--red); }
  .badge.ok { color:var(--green); border-color:var(--green); }
  .layout { display:grid; grid-template-columns: 280px 1fr; gap:20px; }
  @media (max-width: 860px) { .layout { grid-template-columns:1fr; } }
  .list { display:grid; gap:6px; align-content:start; }
  .list .item { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bg2); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .list .item.on { border-color:var(--gold); }
  .list .item img { width:44px; height:32px; object-fit:cover; border-radius:3px; background:var(--bg3); }
  .list .item span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel { background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
  input, select, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:8px 9px; font:inherit; font-size:14px; }
  textarea { min-height:70px; resize:vertical; }
  textarea.code { font:12px/1.5 ui-monospace,Menlo,monospace; min-height:420px; }
  h2 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:22px 0 10px; font-weight:500; }
  .row { display:grid; grid-template-columns: 64px 1.4fr 1fr 1fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .row img { width:64px; height:44px; object-fit:cover; border-radius:3px; background:var(--bg3); }
  @media (max-width: 760px) { .row { grid-template-columns: 64px 1fr; } }
  .actions { display:flex; gap:4px; flex-wrap:wrap; }
  .check { display:flex; align-items:center; gap:8px; color:var(--text); font-size:14px; }
  .check input { width:auto; }
  .hint { color:var(--muted); font-size:12px; margin:6px 0 0; }
  .detail { white-space:pre-wrap; color:var(--muted); font-size:12px; max-width:340px; }
  .upl { display:flex; gap:6px; }
  .upl input[type=text] { flex:1; }
  details.grp { background:var(--bg2); border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  details.grp > summary { cursor:pointer; padding:14px 18px; font-size:15px; font-weight:500; list-style:none; display:flex; justify-content:space-between; }
  details.grp > summary::after { content:'+'; color:var(--gold); }
  details.grp[open] > summary::after { content:'−'; }
  .trow { display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:12px 18px; border-top:1px solid var(--line); }
  .trow .key { grid-column:1 / -1; display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted); }
  .trow textarea { min-height:44px; }
  .trow textarea.changed { border-color:var(--gold); }
  @media (max-width: 760px) { .trow { grid-template-columns:1fr; } }
  .dz { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width: 1000px) { .dz { grid-template-columns:1fr; } }
  .presets { display:flex; flex-wrap:wrap; gap:8px; }
  .colors { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .color { display:flex; align-items:center; gap:10px; }
  .color input[type=color] { width:44px; height:38px; padding:2px; flex:0 0 auto; cursor:pointer; }
  .color input[type=text] { font-family: ui-monospace, Menlo, monospace; }
  .preview { position:sticky; top:80px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .pv { background:var(--bg); color:var(--text); padding:28px; font-family:var(--body); font-size:calc(16px * var(--ts)); line-height:1.6; font-weight:300; }
  .pv .pv-eyebrow { font-family:var(--label); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); font-weight:500; margin:0 0 12px; }
  .pv h1, .pv h2 { color:var(--text); }
  .pv h1 { font-family:var(--display); font-weight:400; font-size:calc(34px * var(--hs)); line-height:1.15; letter-spacing:.06em; text-transform:var(--hcase); margin:0 0 14px; }
  .pv h2 { font-family:var(--display); font-weight:400; font-size:calc(24px * var(--hs)); letter-spacing:.06em; text-transform:var(--hcase); margin:0 0 10px; }
  .pv p { margin:0 0 14px; }
  .pv .muted { color:var(--muted); }
  .pv .pv-btn { display:inline-block; font-family:var(--label); background:var(--btn-bg); color:var(--btn-text); padding:14px 22px; font-size:12px; letter-spacing:.24em; text-transform:uppercase; font-weight:500; margin-right:8px; }
  .pv .pv-btn.ghost { background:transparent; color:var(--text); border:1px solid color-mix(in srgb, var(--text) 25%, transparent); }
  .pv .pv-alt { background:var(--bg-2); margin:22px -28px -28px; padding:22px 28px; border-top:1px solid color-mix(in srgb, var(--text) 12%, transparent); }
  .pv .pv-line { border-top:1px solid var(--gold); width:56px; margin:14px 0; }
  .range { display:flex; align-items:center; gap:12px; }
  .range input { flex:1; }
  .range output { width:52px; text-align:right; color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>Formica admin</h1>
  <nav id="tabs">
    <button data-tab="leads" class="on">Leads</button>
    <button data-tab="projects">Projects</button>
    <button data-tab="videos">Video Journal</button>
    <button data-tab="team">Team</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="estimator">Estimator rates</button>
    <button data-tab="texts">Тексты сайта</button>
    <button data-tab="design">Дизайн</button>
  </nav>
  <span class="spacer"></span>
  <span id="status"></span>
  <button class="btn primary" id="save">Save changes</button>
  <a class="btn" href="/" target="_blank">Open site</a>
</header>
<main id="main"></main>
<script src="/js/i18n.js"></script>
<script>window.__ADMIN__ = true;</script>
<script src="/js/design.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>

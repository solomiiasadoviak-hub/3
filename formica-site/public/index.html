<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formica Building Contracting — Complete Renovation in Dubai</title>
<meta name="description" content="Formica — complete renovation of apartments, villas and commercial properties in Dubai: design, approvals, construction, finishing and handover. Get a preliminary estimate online.">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:title" content="Formica Building Contracting — Complete Renovation in Dubai">
<meta property="og:description" content="From design and approvals to construction, finishing and final handover.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="alternate" hreflang="en" href="/en"><link rel="alternate" hreflang="ru" href="/ru">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/design.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>

<main>
  <!-- 1. HERO -->
  <section id="hero" class="hero">
    <div class="hero-media" id="hero-media"></div>
    <div class="hero-shade"></div>
    <div class="hero-content container">
      <p class="eyebrow light" data-i18n="hero.eyebrow"></p>
      <span class="rule"></span>
      <h1 class="display" data-i18n="hero.title"></h1>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <div class="hero-ctas">
        <a class="btn btn-solid" href="#estimate" data-i18n="hero.cta1"></a>
        <a class="btn btn-ghost" href="#projects" data-i18n="hero.cta2"></a>
      </div>
    </div>
    <a class="hero-scroll" href="#about"><span data-i18n="hero.scroll"></span><i></i></a>
  </section>

  <!-- 2. ABOUT -->
  <section id="about" class="section">
    <div class="container narrow center reveal">
      <img class="emblem" src="/img/logo.svg" alt="" width="64" height="64">
      <p class="eyebrow" data-i18n="about.eyebrow"></p>
      <h2 class="h2" data-i18n="about.title"></h2>
      <p class="lead" data-i18n="about.p1"></p>
      <div class="about-copy">
        <p data-i18n="about.p2"></p><p data-i18n="about.p3"></p><p data-i18n="about.p4"></p>
      </div>
    </div>

    <div class="container">
      <p class="eyebrow center sub-eyebrow" data-i18n="exp.eyebrow"></p>
      <div class="stats">
        <div class="stat reveal"><div class="stat-n" data-i18n="exp.1.n"></div><div class="stat-t" data-i18n="exp.1.t"></div><p data-i18n="exp.1.d"></p></div>
        <div class="stat reveal"><div class="stat-n" data-i18n="exp.2.n"></div><div class="stat-t" data-i18n="exp.2.t"></div><p data-i18n="exp.2.d"></p></div>
        <div class="stat reveal"><div class="stat-n" data-i18n="exp.3.n"></div><div class="stat-t" data-i18n="exp.3.t"></div><p data-i18n="exp.3.d"></p></div>
        <div class="stat reveal"><div class="stat-n" data-i18n="exp.4.n"></div><div class="stat-t" data-i18n="exp.4.t"></div><p data-i18n="exp.4.d"></p></div>
      </div>
    </div>

    <div class="container team-wrap">
      <div class="section-head reveal">
        <p class="eyebrow" data-i18n="team.eyebrow"></p>
        <h2 class="h2" data-i18n="team.title"></h2>
      </div>
      <div class="team" id="team"></div>
    </div>

    <div class="container why">
      <p class="eyebrow" data-i18n="why.eyebrow"></p>
      <div class="why-list">
        <div class="why-item reveal"><span class="num">01</span><h3 data-i18n="why.1.t"></h3><p data-i18n="why.1.d"></p></div>
        <div class="why-item reveal"><span class="num">02</span><h3 data-i18n="why.2.t"></h3><p data-i18n="why.2.d"></p></div>
        <div class="why-item reveal"><span class="num">03</span><h3 data-i18n="why.3.t"></h3><p data-i18n="why.3.d"></p></div>
        <div class="why-item reveal"><span class="num">04</span><h3 data-i18n="why.4.t"></h3><p data-i18n="why.4.d"></p></div>
      </div>
    </div>
  </section>

  <!-- 3. PORTFOLIO -->
  <section id="projects" class="section alt">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" data-i18n="pf.eyebrow"></p>
        <h2 class="h2" data-i18n="pf.title"></h2>
      </div>
      <div class="tabs" role="tablist" id="pf-cats"></div>
      <div class="chips" id="pf-types"></div>
      <div id="pf-feature"></div>
      <div class="cards" id="pf-cards"></div>
    </div>
  </section>

  <!-- 4. VIDEO JOURNAL -->
  <section id="videos" class="section">
    <div class="container">
      <div class="section-head split">
        <div><p class="eyebrow" data-i18n="vj.eyebrow"></p><h2 class="h2" data-i18n="vj.title"></h2></div>
        <p class="muted" data-i18n="vj.sub"></p>
      </div>
      <div class="video-grid" id="vj-grid"></div>
      <div class="center mt-l"><a class="btn btn-ghost" id="vj-all" href="/videos" data-i18n="vj.open"></a></div>
    </div>
  </section>

  <!-- 5. HOW WE WORK -->
  <section id="how" class="section alt">
    <div class="container">
      <div class="section-head center">
        <p class="eyebrow" data-i18n="how.eyebrow"></p>
        <h2 class="h2" data-i18n="how.title"></h2>
      </div>
      <div class="options">
        <article class="option reveal">
          <p class="eyebrow" data-i18n="opt1.label"></p>
          <h3 class="h3" data-i18n="opt1.t"></h3>
          <p class="lead-s" data-i18n="opt1.lead"></p>
          <p data-i18n="opt1.d"></p>
          <p class="tagline" data-i18n="opt1.tag"></p>
          <a class="btn btn-solid" href="#estimate" data-start="design" data-i18n="opt1.btn"></a>
        </article>
        <article class="option reveal">
          <p class="eyebrow" data-i18n="opt2.label"></p>
          <h3 class="h3" data-i18n="opt2.t"></h3>
          <p class="lead-s" data-i18n="opt2.lead"></p>
          <p data-i18n="opt2.d"></p>
          <p class="tagline" data-i18n="opt2.tag"></p>
          <a class="btn btn-solid" href="#estimate" data-start="concept" data-i18n="opt2.btn"></a>
        </article>
      </div>

      <div class="resp">
        <h2 class="h2 center reveal" data-i18n="resp.title"></h2>
        <div class="resp-cols">
          <div class="resp-col reveal">
            <h3 class="h3" data-i18n="resp.you"></h3><p class="muted" data-i18n="resp.you.d"></p>
            <ul class="ticks"><li data-i18n="resp.you.1"></li><li data-i18n="resp.you.2"></li><li data-i18n="resp.you.3"></li><li data-i18n="resp.you.4"></li><li data-i18n="resp.you.5"></li></ul>
          </div>
          <div class="resp-col reveal">
            <h3 class="h3" data-i18n="resp.we"></h3><p class="muted" data-i18n="resp.we.d"></p>
            <ul class="ticks"><li data-i18n="resp.we.1"></li><li data-i18n="resp.we.2"></li><li data-i18n="resp.we.3"></li><li data-i18n="resp.we.4"></li><li data-i18n="resp.we.5"></li><li data-i18n="resp.we.6"></li><li data-i18n="resp.we.7"></li><li data-i18n="resp.we.8"></li></ul>
          </div>
        </div>
        <p class="resp-foot center" data-i18n="resp.foot"></p>
      </div>

      <div class="steps-wrap">
        <div class="section-head center">
          <p class="eyebrow" data-i18n="steps.eyebrow"></p>
          <h2 class="h2" data-i18n="steps.title"></h2>
        </div>
        <ol class="steps">
          <li class="reveal"><span class="dia"></span><small>01</small><h3 data-i18n="step.1.t"></h3><p data-i18n="step.1.d"></p></li>
          <li class="reveal"><span class="dia"></span><small>02</small><h3 data-i18n="step.2.t"></h3><p data-i18n="step.2.d"></p></li>
          <li class="reveal"><span class="dia"></span><small>03</small><h3 data-i18n="step.3.t"></h3><p data-i18n="step.3.d"></p></li>
          <li class="reveal"><span class="dia"></span><small>04</small><h3 data-i18n="step.4.t"></h3><p data-i18n="step.4.d"></p></li>
          <li class="reveal"><span class="dia"></span><small>05</small><h3 data-i18n="step.5.t"></h3><p data-i18n="step.5.d"></p></li>
        </ol>
      </div>

      <div class="faq">
        <h2 class="h2 center" data-i18n="faq.title"></h2>
        <details><summary data-i18n="faq.1.q"></summary><div><p data-i18n="faq.1.a"></p><a class="link-arrow" href="#projects" data-i18n="faq.1.btn"></a></div></details>
        <details><summary data-i18n="faq.2.q"></summary><div><p data-i18n="faq.2.a"></p></div></details>
        <details><summary data-i18n="faq.3.q"></summary><div><p data-i18n="faq.3.a"></p></div></details>
        <details><summary data-i18n="faq.4.q"></summary><div><p data-i18n="faq.4.a"></p></div></details>
        <details><summary data-i18n="faq.5.q"></summary><div><p data-i18n="faq.5.a"></p></div></details>
        <details><summary data-i18n="faq.6.q"></summary><div><p data-i18n="faq.6.a"></p></div></details>
      </div>
    </div>
  </section>

  <!-- 6. ESTIMATE / CONTACT -->
  <section id="estimate" class="section estimate-section">
    <div class="container estimate-layout">
      <div class="estimate-intro">
        <p class="eyebrow" data-i18n="est.eyebrow"></p>
        <h2 class="h2" data-i18n="est.title"></h2>
        <p class="muted" data-i18n="est.sub"></p>
        <p class="eyebrow small mt-l" data-i18n="est.direct"></p>
        <ul class="direct" id="direct"></ul>
      </div>
      <div class="estimate-box">
        <div class="tabs boxed" role="tablist">
          <button type="button" role="tab" class="tab" aria-selected="true" data-pane="calc" data-i18n="est.tab.calc"></button>
          <button type="button" role="tab" class="tab" aria-selected="false" data-pane="consult" data-i18n="est.tab.consult"></button>
        </div>
        <div class="pane" id="pane-calc"></div>
        <div class="pane" id="pane-consult" hidden></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<div class="modal" id="video-modal" hidden>
  <button class="modal-close" type="button" data-i18n-aria="close">×</button>
  <div class="modal-body"></div>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
<script src="/js/media.js"></script>
<script src="/js/estimator.js"></script>
<script src="/js/home.js"></script>
</body>
</html>

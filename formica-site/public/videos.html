<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Journal — Formica Building Contracting</title>
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>
<body class="inner">

<main class="page">

      <div class="section-head split">
        <div><p class="eyebrow" data-i18n="vj.eyebrow"></p><h1 class="h1" data-i18n="vj.title"></h1></div>

      </div>
      <div class="chips" id="vj-cats"></div>
      <div class="video-grid" id="vj-grid"></div>
    </div>
  </section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<div class="modal" id="video-modal" hidden>
  <button class="modal-close" type="button" data-i18n-aria="close">×</button>
  <div class="modal-body"></div>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/common.js"></script>
